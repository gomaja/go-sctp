version: 2

updates:
  # go-ctxsync follows main without tags. Update its pseudo-version manually
  # with go get github.com/gomaja/go-ctxsync@main, then run the Linux suite.
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '04:00'
      timezone: Europe/Paris
    open-pull-requests-limit: 10
    commit-message:
      prefix: deps
    groups:
      go-modules:
        patterns:
          - '*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '04:30'
      timezone: Europe/Paris
    open-pull-requests-limit: 10
    commit-message:
      prefix: deps
    groups:
      actions:
        patterns:
          - '*'

  - package-ecosystem: docker
    directory: /testdata/bigendian
    schedule:
      interval: weekly
      day: monday
      time: '05:00'
      timezone: Europe/Paris
    open-pull-requests-limit: 10
    commit-message:
      prefix: deps
