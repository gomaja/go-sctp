name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: stable
          cache: true
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi
      - name: diff check
        run: git diff --check

  test-linux:
    name: test-linux / Go ${{ matrix.go }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ['1.21.x', stable]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - name: Prepare SCTP support
        run: |
          sudo modprobe sctp
          test -e /proc/net/sctp/snmp
          sudo sysctl -w net.sctp.auth_enable=1 >/dev/null 2>&1 || true
          sudo sysctl -w net.sctp.intl_enable=1 >/dev/null 2>&1 || true
          for ip in 127.0.0.2 127.0.0.3 127.0.0.4; do
            sudo ip addr add "$ip/8" dev lo 2>/dev/null || true
          done
      - name: go test
        run: go test ./... -count=1 -timeout 900s

  test-linux-race:
    name: test-linux race
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: stable
          cache: true
      - name: Prepare SCTP support
        run: |
          sudo modprobe sctp
          test -e /proc/net/sctp/snmp
          sudo sysctl -w net.sctp.auth_enable=1 >/dev/null 2>&1 || true
          sudo sysctl -w net.sctp.intl_enable=1 >/dev/null 2>&1 || true
          for ip in 127.0.0.2 127.0.0.3 127.0.0.4; do
            sudo ip addr add "$ip/8" dev lo 2>/dev/null || true
          done
      - name: go test -race
        run: go test ./... -race -count=1 -timeout 900s

  vet:
    name: vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: stable
          cache: true
      - name: go vet
        run: go vet ./...
      - name: cross vet
        run: |
          for target in linux/386 linux/arm linux/s390x linux/mips; do
            echo "== $target =="
            GOOS="${target%/*}" GOARCH="${target#*/}" CGO_ENABLED=0 go vet ./...
          done

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: stable
          cache: true
      - uses: dominikh/staticcheck-action@v1.4.1
        with:
          version: v0.8.0-rc.1
          install-go: false
      - uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: latest

  portability:
    name: portability / ${{ matrix.kind }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: cross-compile
            os: ubuntu-latest
            command: go test -run '^TestCrossCompileSmoke$' . -count=1 -timeout 900s
          - kind: unsupported-macos
            os: macos-latest
            command: go test ./... -short -count=1
          - kind: unsupported-windows
            os: windows-latest
            command: go test ./... -short -count=1
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: stable
          cache: true
      - name: go test
        run: ${{ matrix.command }}

  arch-32bit:
    name: portability / kernel linux-386
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: stable
          cache: true
      - name: Prepare SCTP support
        run: |
          sudo modprobe sctp
          test -e /proc/net/sctp/snmp
          sudo sysctl -w net.sctp.auth_enable=1 >/dev/null 2>&1 || true
          sudo sysctl -w net.sctp.intl_enable=1 >/dev/null 2>&1 || true
          for ip in 127.0.0.2 127.0.0.3 127.0.0.4; do
            sudo ip addr add "$ip/8" dev lo 2>/dev/null || true
          done
      - name: Build the 32-bit test binary
        run: CGO_ENABLED=0 GOOS=linux GOARCH=386 go test -c -o sctp-386.test .
      - name: Run it against the host kernel
        # The runner is x86_64, so a static i686 binary executes natively. This
        # runs the socketcall path in sctp_syscall_linux_386.go against a real
        # SCTP stack rather than only compiling it. It is the one architecture
        # besides the host's own that can run the socket-backed suite at all;
        # the big-endian job below records why emulation cannot.
        run: ./sctp-386.test -test.count=1 -test.timeout=900s

  arch-big-endian:
    name: portability / big-endian s390x
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: stable
          cache: true
      - uses: docker/setup-qemu-action@v4.4.0
        with:
          platforms: s390x
      - name: Build the s390x test binary
        run: CGO_ENABLED=0 GOOS=linux GOARCH=s390x go test -c -o sctp-s390x.test .
      - name: Run the byte-order and layout surface
        # qemu-user translates setsockopt per level and has no case for
        # SOL_SCTP (132), so every socket-backed test here fails with
        # EPROTONOSUPPORT no matter what the library does. Only a full-system
        # emulator running its own s390x kernel could exercise those. What this
        # job does cover is where a byte-order or width assumption would
        # actually hide: fixed-offset reads over kernel structures, the cmsg
        # builders and parsers, and address marshalling.
        #
        # The four skipped tests match the selection but need a socket. They
        # are named rather than dropped silently, so the exclusion stays
        # visible if one of them later stops needing one.
        run: |
          docker run --rm --platform linux/s390x -v "$PWD":/w -w /w alpine \
            ./sctp-s390x.test -test.count=1 -test.timeout=900s \
            -test.run 'Layout|MatchesKernel|MatchesStruct|Cmsg|Marshal|Resolve|Decode|NetworkOrder|WidthAliasing|Padding|Alignment|ConstantsMatch|AncillaryParsers|ParseNotification|ParseRcvInfo|NotificationAccumulator' \
            -test.skip 'TestParseNotificationAgainstKernel|TestPooledOobHoldsEveryInfoCmsgAtOnce|TestSackTimerLayoutAndRoundTrip|TestResetStreamsWireLayout'

  vuln:
    name: vuln
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: stable
          cache: true
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
